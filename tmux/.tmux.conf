# ── Prefix ──────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Terminal capabilities ───────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"        # true color
set -as terminal-features ",*:usstyle"    # undercurl
set -g focus-events on

# ── Mouse / behavior ────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10                    # snappy ESC for nvim
set -g display-panes-time 2000            # `prefix q` numbers linger long enough to pick

# ── Indexing ────────────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on

# Highlight background windows that have output, but stay silent
setw -g monitor-activity on
set  -g visual-activity off
set  -g activity-action none
set  -g bell-action none

# Manual window names stick (don't auto-rename to running process)
setw -g automatic-rename off
set  -g allow-rename off

# ── Key bindings ────────────────────────────────────────────────────────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# Swap window position, repeatable (window stays current as it moves)
bind -r < swap-window -t -1
bind -r > swap-window -t +1

# Toggle synchronize-panes: type once, executes in every pane of the window
bind S setw synchronize-panes \; display "sync: #{?pane_synchronized,on,off}"

# Edit config in a floating popup
bind e display-popup -E -w 80% -h 80% "$EDITOR ~/.tmux.conf"

# Join a pane from another window into the current one (break-pane is `!` by default)
bind @ command-prompt -p "join pane from window:" "join-pane -s ':%%'"

# Session picker without lifting off Ctrl
bind C-s choose-tree -Zs

# Clear screen AND scrollback (plain C-l only clears the visible screen)
bind C-l send-keys 'C-l' \; clear-history

# ── Vim-style ───────────────────────────────────────────────────────────
setw -g mode-keys vi                       # h/j/k/l, w/b, /, etc. in copy mode
set  -g status-keys vi                     # vi editing at the command prompt
set  -s set-clipboard on                   # OSC 52: yank reaches the host clipboard

# Pane navigation (overrides default `l` last-window)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize, repeatable while prefix is held
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy-mode: vim-style selection + yank
# Pipe to wl-copy --primary so middle-click paste works on Wayland.
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel "wl-copy --primary"

# Mouse drag-select stays in copy mode (q/Esc to exit), populates PRIMARY.
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "wl-copy --primary"

# Middle-click in a pane pastes the Wayland PRIMARY selection (mouse on
# otherwise swallows middle-click and breaks select-anywhere-paste-anywhere).
bind -n MouseDown2Pane select-pane \; run "wl-paste --primary --no-newline | tmux load-buffer -; tmux paste-buffer"

# ── Pane borders ────────────────────────────────────────────────────────
set -g pane-border-style        "fg=colour238"
set -g pane-active-border-style "fg=colour39"

# ── Status bar (minimal/clean dark) ─────────────────────────────────────
set -g status-style "fg=colour250,bg=colour234"
set -g status-left  "#[fg=colour39,bold] #S "
set -g status-left-length 30
# bw lock indicator: green UNLOCKED if rbw agent is unlocked, red LOCKED otherwise
set -g status-right "#(rbw unlocked >/dev/null 2>&1 && echo '#[fg=colour40,bold]UNLOCKED' || echo '#[fg=colour203,bold]LOCKED')#[default] #[fg=colour244]%Y-%m-%d %H:%M "
set -g status-right-length 60
setw -g window-status-format         " #I:#W "
setw -g window-status-current-format "#[fg=colour234,bg=colour39,bold] #I:#W "
setw -g window-status-separator ""

# ── Hooks ───────────────────────────────────────────────────────────────
# Wipe persisted bw session when a tmux session ends (kill-session or last
# attached client detaches). Pane close does NOT trigger this.
set-hook -g session-closed 'run-shell "rm -f ~/.config/bw/session.env"'
