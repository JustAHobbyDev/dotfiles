# ── Prefix ──────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Terminal capabilities ───────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"        # true color
set -as terminal-features ",*:usstyle"    # undercurl
set -g focus-events on

# ── Mouse / behavior ────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10                    # snappy ESC for nvim

# ── Indexing ────────────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Key bindings ────────────────────────────────────────────────────────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# ── Vim-style ───────────────────────────────────────────────────────────
setw -g mode-keys vi                       # h/j/k/l, w/b, /, etc. in copy mode
set  -g status-keys vi                     # vi editing at the command prompt
set  -s set-clipboard on                   # OSC 52: yank reaches the host clipboard

# Pane navigation (overrides default `l` last-window)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize, repeatable while prefix is held
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy-mode: vim-style selection + yank
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel

# ── Status bar (minimal/clean dark) ─────────────────────────────────────
set -g status-style "fg=colour250,bg=colour234"
set -g status-left  "#[fg=colour39,bold] #S "
set -g status-left-length 30
set -g status-right "#[fg=colour244]%Y-%m-%d %H:%M "
set -g status-right-length 40
setw -g window-status-format         " #I:#W "
setw -g window-status-current-format "#[fg=colour234,bg=colour39,bold] #I:#W "
setw -g window-status-separator ""

# ── Hooks ───────────────────────────────────────────────────────────────
# Wipe persisted bw session when a tmux session ends (kill-session or last
# attached client detaches). Pane close does NOT trigger this.
set-hook -g session-closed 'run-shell "rm -f ~/.config/bw/session.env"'
